dataSources:
  - kind: ethereum/contract
    name: kek
    network: base
    source:
      address: "0x5e294A13E01e78fbE02C17d966BdA39bd1Ccf6c4"
      abi: Contract
      startBlock: 34095911
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - BridgeTransfer
      abis:
        - name: Contract
          file: ./abis/Contract.json
      eventHandlers:
        - event: BridgingTokens(address,address,address,uint256,bytes32)
