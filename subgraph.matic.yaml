specVersion: 0.0.4
schema:
  file: schema.graphql
dataSources:
  # Alchemica from matic to Base
  - kind: ethereum/contract
    name: kek_base
    network: matic
    source:
      address: "0xBD638B054848409d1321070C22876cCE2c4b1608"
      abi: Contract
      startBlock: 75103921
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - BridgeTransfer
      abis:
        - name: Contract
          file: ./abis/Contract.json
      eventHandlers:
        - event: BridgingTokens(address,address,address,uint256,bytes32)
          handler: handleBridgingTokensOnPolygon
        - event: TokensBridged(address,address,uint256,bytes32)
          handler: handleTokensBridgedOnPolygon
